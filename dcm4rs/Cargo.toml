[package]
name = "dcm4rs"
description = "Pure-Rust DICOM data model, data dictionary and file I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
keywords = ["dicom", "medical", "imaging"]
categories = ["parser-implementations", "encoding"]
readme = "../README.md"
documentation = "https://docs.rs/dcm4rs"

[features]
default = ["pixel-jpeg"]
pixel-jpeg = ["dep:zune-jpeg", "dep:oxiarc-jpeg", "dep:jpeg-encoder"]
pixel-jpegls = ["dep:charls"]
pixel-j2k = ["dep:jpeg2k"]
pixel-jxl = ["dep:jxl-oxide", "dep:oxideav-jpegxl"]

[dependencies]
encoding_rs = "0.8"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
charls = { version = "0.4", optional = true }
jpeg2k = { version = "0.11", optional = true, default-features = false }
jpeg-encoder = { version = "0.6", optional = true }
jxl-oxide = { version = "0.10", optional = true, default-features = false }
oxiarc-jpeg = { version = "0.4", optional = true }
oxideav-jpegxl = { version = "0.0.15", optional = true, default-features = false }
zune-jpeg = { version = "0.4", optional = true }

[dev-dependencies]
jpeg-encoder = "0.6"
oxiarc-jpeg = "0.4"
