name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Cache pylibjpeg-data
        uses: actions/cache@v4
        with:
          path: .cache/pylibjpeg-data
          key: pylibjpeg-data-v1
          restore-keys: pylibjpeg-data-
      - name: Fetch pylibjpeg-data
        run: sh scripts/fetch-pylibjpeg-data.sh
        env:
          PYLIBJPEG_DATA_DIR: ${{ github.workspace }}/.cache/pylibjpeg-data
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The corpus conformance run is part of the coverage run, so the codec paths it exercises
      # are measured instead of only the unit tests.
      - name: Coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
        env:
          PYLIBJPEG_DATA_DIR: ${{ github.workspace }}/.cache/pylibjpeg-data
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: none
            args: ""
          - name: pixel-jpeg
            args: "--features pixel-jpeg"
          - name: pixel-jpegls
            args: "--features pixel-jpegls"
          - name: pixel-j2k
            args: "--features pixel-j2k"
          - name: pixel-jxl
            args: "--features pixel-jxl"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache pylibjpeg-data
        uses: actions/cache@v4
        with:
          path: .cache/pylibjpeg-data
          key: pylibjpeg-data-v1
          restore-keys: pylibjpeg-data-
      - name: Fetch pylibjpeg-data
        run: sh scripts/fetch-pylibjpeg-data.sh
        env:
          PYLIBJPEG_DATA_DIR: ${{ github.workspace }}/.cache/pylibjpeg-data
      # The all-features job hides a feature that only compiles alongside another, so each
      # feature is built and tested on its own here.
      - name: Test
        run: cargo test -p dcm4rs --no-default-features ${{ matrix.args }}
