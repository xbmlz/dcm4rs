name: pylibjpeg-data

# A nightly run against a fresh clone of the corpus, so datasets added upstream are decoded
# without waiting for a pull request. Pull request and main runs cover it inside CI already.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pylibjpeg-data
        run: sh scripts/fetch-pylibjpeg-data.sh
        env:
          PYLIBJPEG_DATA_DIR: ${{ github.workspace }}/.cache/pylibjpeg-data
      - name: Decode corpus
        run: cargo test --all-features --test pylibjpeg_data -- --nocapture
        env:
          PYLIBJPEG_DATA_DIR: ${{ github.workspace }}/.cache/pylibjpeg-data
